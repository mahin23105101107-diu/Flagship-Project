<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlagShip — Feature-Flag &amp; Gradual-Rollout Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" class="card login">
    <h1>FlagShip</h1>
    <p class="muted">Ship Features. Control Releases. Stay Resilient.</p>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button class="btn" type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</div>
<div id="app" class="hidden">
  <aside>
    <h2>FlagShip</h2>
    <nav id="nav"></nav>
    <button id="logout" class="btn ghost">Log out</button>
  </aside>
  <main>
    <header>
      <select id="project"></select>
      <button id="theme" class="btn ghost">Theme</button>
      <span id="user" class="muted"></span>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
